<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound Slider</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#3b2f63;--mute:#6b6a9a;--line:#ffd166;--accent:#ff4f8b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:"Fredoka","Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px;background:radial-gradient(circle at 12% 14%,#fff 0 38px,transparent 40px),radial-gradient(circle at 17% 12%,#fff 0 30px,transparent 32px),radial-gradient(circle at 85% 22%,#fff 0 42px,transparent 44px),radial-gradient(circle at 90% 20%,#fff 0 30px,transparent 32px),linear-gradient(#8fd3ff 0%,#d8f1ff 55%,#b8f0a8 90%,#7ed957 100%);background-attachment:fixed}
.screen{width:100%;max-width:820px;display:none;flex-direction:column;align-items:center;gap:18px}
.screen.on{display:flex}
h1{margin:6px 0 0;font-size:2.4rem;color:#ff4f8b;text-shadow:0 3px 0 #fff,4px 6px 0 rgba(0,0,0,.15);text-align:center}
.sub{margin:0;color:var(--ink);font-weight:500;font-size:1.15rem;text-align:center}
.card{background:#fffdf5;border:5px solid var(--line);border-radius:30px;box-shadow:0 8px 0 #f2b84b,0 14px 24px rgba(0,0,0,.15);padding:20px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
button{font:inherit;font-weight:600;font-size:1.05rem;padding:10px 20px;border-radius:999px;border:3px solid #fff;background:#4d96ff;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:linear-gradient(#ff8fb8,#ff4f8b);font-size:1.4rem;padding:12px 34px}
#add{background:#2ec4b6}#showPic{background:#ff9f1c}#sayEn{background:#9b5de5}#reset{background:#ffb703;color:#3b2f63}#back{background:#7a7fa8}
#list{width:100%;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:10px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:14px;border:3px solid #ffd166;background:#fff}
.item input{flex:1;min-width:0;font:inherit;font-size:1.4rem;font-weight:600;padding:8px 14px;border-radius:20px;border:4px solid #b79cff;background:#fff;color:var(--ink)}
.item button{padding:8px 14px;background:#ff6b6b}
.item .gr{display:flex;gap:4px;flex-wrap:wrap;max-width:40%}
.hint{font-size:.95rem;color:var(--ink);font-weight:500;text-align:center;background:rgba(255,255,255,.75);padding:4px 14px;border-radius:14px}
.count{font-weight:700;font-size:1.3rem;color:#fff;background:#9b5de5;padding:4px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pic{width:min(100%,480px);height:320px;border:5px solid #ffd166;border-radius:28px;background:#fff;color:#ff9f1c;font-size:6rem;box-shadow:0 8px 0 #f2b84b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wrap{position:relative;display:inline-block;max-width:100%;margin-top:10px}
.boxes{display:flex;gap:10px;justify-content:center}
.box{--c:#ff6b6b;font-size:clamp(2.2rem,8.5vw,4.2rem);font-weight:700;padding:5px 16px;min-width:60px;text-align:center;background:#fff;border:6px solid var(--c);color:var(--c);border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.15);transition:background .12s,color .12s,transform .12s}
.box:nth-child(6n+2){--c:#ff9f1c}.box:nth-child(6n+3){--c:#2ec4b6}.box:nth-child(6n+4){--c:#4d96ff}.box:nth-child(6n+5){--c:#9b5de5}.box:nth-child(6n+6){--c:#f15bb5}
.box.lit{background:var(--c);color:#fff;transform:translateY(-8px) scale(1.06);box-shadow:0 14px 0 rgba(0,0,0,.18)}
.chip{font-size:1.1rem;font-weight:700;border:3px solid #4d96ff;color:#4d96ff;border-radius:12px;padding:2px 8px;background:#fff}
.track{position:relative;height:80px;margin-top:22px;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.rail,.fill{position:absolute;left:0;top:50%;height:18px;margin-top:-9px;border-radius:9px}
.rail{right:0;background:linear-gradient(90deg,#ff6b6b,#ff9f1c,#ffd23f,#2ec4b6,#4d96ff,#9b5de5);opacity:.5}
.fill{background:#ff4f8b;width:0}
.knob{position:absolute;top:50%;left:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#ffd23f;border:5px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.knob::after{content:"⭐"}
</style>
</head>
<body>

<section class="screen on" id="s1">
  <h1>🌈 Sound Slider ⭐</h1>
  <p class="sub">Upload your pictures and type the word for each one.</p>
  <div class="card">
    <div id="list"></div>
    <button id="add">＋ Add pictures</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="hint">Sounds like <b>sh</b> are grouped automatically. To choose your own groups, type hyphens, like <b>s-t-ar</b>.</div>
    <div class="sub" id="msg"></div>
    <button class="main" id="go" disabled>Start ➜</button>
  </div>
</section>

<section class="screen" id="s2">
  <div class="count" id="count"></div>
  <div class="pic" id="pic">?</div>
  <div class="row">
    <button id="showPic">Show picture</button>
    <button id="sayEn">🔊 Say word</button>
    <button id="reset">Reset</button>
    <button id="back">← Edit list</button>
  </div>
  <div class="wrap" id="wrap">
    <div class="boxes" id="boxes"></div>
    <div class="track" id="track"><div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  </div>
  <button class="main" id="next">Next picture ➜</button>
  <p class="hint">Drag the star from left to right. Each sound lights up as you reach it.</p>
</section>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var tri=["igh","tch"],
      di=["sh","ch","th","ck","ng","wh","ph","qu","kn","wr","ee","oo","ai","ay","oa","ou","ow","oi","oy","ar","or","er","ir","ur","ea","ie","ue","ew","au","aw","ll","ss","ff","zz"];
  var items=[],MAX=30,idx=0,picShown=false,wasAll=false,dragging=false,boxEls=[];

  function groupsOf(w){
    if(w.indexOf("-")>-1)return w.split("-").filter(Boolean);
    var g=[],i=0;
    while(i<w.length){
      var len=1;
      if(tri.indexOf(w.substr(i,3))>-1)len=3;
      else if(di.indexOf(w.substr(i,2))>-1)len=2;
      g.push(w.substr(i,len));i+=len;
    }
    return g;
  }
  function say(t){
    if(!window.speechSynthesis||!t)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.8;
    speechSynthesis.speak(u);
  }

  // Screen 1
  function check(){
    $("go").disabled=!(items.length>0&&items.every(function(p){return p.word}));
    $("add").disabled=items.length>=MAX;
    $("msg").textContent=items.length?items.length+" picture"+(items.length>1?"s":"")+" added":"No pictures yet";
  }
  function showGroups(p,el){
    el.innerHTML="";
    groupsOf(p.word).forEach(function(t){var c=document.createElement("span");c.className="chip";c.textContent=t;el.appendChild(c)});
  }
  function renderList(){
    var l=$("list");l.innerHTML="";
    items.forEach(function(p,i){
      var d=document.createElement("div");d.className="item";
      var im=new Image();im.src=p.src;
      var t=document.createElement("input");t.type="text";t.value=p.word;t.placeholder="Type the word";
      t.autocapitalize="off";t.spellcheck=false;
      var g=document.createElement("div");g.className="gr";showGroups(p,g);
      t.oninput=function(){p.word=t.value.toLowerCase().replace(/[^a-z-]/g,"");showGroups(p,g);check()};
      var x=document.createElement("button");x.textContent="✕";x.setAttribute("aria-label","Remove");
      x.onclick=function(){items.splice(i,1);renderList()};
      d.appendChild(im);d.appendChild(t);d.appendChild(g);d.appendChild(x);l.appendChild(d);
    });
    check();
  }
  $("add").onclick=function(){$("file").click()};
  $("file").onchange=function(e){
    var files=Array.prototype.slice.call(e.target.files).slice(0,MAX-items.length);
    var res=new Array(files.length),left=files.length;
    files.forEach(function(f,n){
      var r=new FileReader();
      r.onload=function(){
        res[n]={src:r.result,word:f.name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z]/g,"")};
        if(--left===0){items=items.concat(res);renderList()}
      };
      r.readAsDataURL(f);
    });
    e.target.value="";
  };

  // Screen 2
  function show(i){
    idx=i;var p=items[i];
    $("count").textContent="Picture "+(i+1)+" of "+items.length;
    picShown=false;$("pic").textContent="?";$("showPic").textContent="Show picture";
    var b=$("boxes");b.innerHTML="";boxEls=[];
    groupsOf(p.word).forEach(function(t){var d=document.createElement("div");d.className="box";d.textContent=t;b.appendChild(d);boxEls.push(d)});
    $("next").textContent=i===items.length-1?"↺ Back to first picture":"Next picture ➜";
    wasAll=false;setX0(0);
  }
  $("go").onclick=function(){$("s1").classList.remove("on");$("s2").classList.add("on");show(0)};
  $("back").onclick=function(){$("s2").classList.remove("on");$("s1").classList.add("on")};
  $("next").onclick=function(){show((idx+1)%items.length)};
  $("showPic").onclick=function(){
    picShown=!picShown;
    var p=$("pic");p.innerHTML="";
    if(picShown){var im=new Image();im.src=items[idx].src;p.appendChild(im)}else p.textContent="?";
    this.textContent=picShown?"Hide picture":"Show picture";
  };
  $("sayEn").onclick=function(){say(items[idx].word.replace(/-/g,""))};
  $("reset").onclick=function(){setX(0)};

  function setX(x){
    setX0(x);
    var all=boxEls.length>0&&boxEls.every(function(b){return b.classList.contains("lit")});
    if(all&&!wasAll)say(items[idx].word.replace(/-/g,""));
    wasAll=all;
  }
  function setX0(x){
    var w=$("track").clientWidth;
    x=Math.max(0,Math.min(w,x));
    $("fill").style.width=x+"px";$("knob").style.left=x+"px";
    boxEls.forEach(function(b){
      b.classList.toggle("lit",x>0&&x>=b.offsetLeft+b.offsetWidth*0.4);
    });
  }
  var tr=$("track");
  function move(e){setX(e.clientX-tr.getBoundingClientRect().left)}
  tr.addEventListener("pointerdown",function(e){dragging=true;tr.setPointerCapture(e.pointerId);move(e);e.preventDefault()});
  tr.addEventListener("pointermove",function(e){if(dragging)move(e)});
  tr.addEventListener("pointerup",function(){dragging=false});
  tr.addEventListener("pointercancel",function(){dragging=false});
  window.addEventListener("resize",function(){if($("s2").classList.contains("on"))setX0(0)});
  renderList();
})();
</script>
</body>
</html>
