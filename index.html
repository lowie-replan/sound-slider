<!DOCTYPE html>
<html lang="en">
<head>

<title>Sound Slider</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#3b2f63;--mute:#6b6a9a;--line:#ffd166;--accent:#ff4f8b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.screen{width:100%;max-width:820px;display:none;flex-direction:column;align-items:center;gap:18px}
.screen.on{display:flex}
h1{margin:6px 0 0;font-size:2.4rem;color:#ff4f8b;text-shadow:0 3px 0 #fff,4px 6px 0 rgba(0,0,0,.15);text-align:center}
.sub{margin:0;color:var(--ink);font-weight:500;font-size:1.15rem;text-align:center}
.card{background:#fffdf5;border:5px solid var(--line);border-radius:30px;box-shadow:0 8px 0 #f2b84b,0 14px 24px rgba(0,0,0,.15);padding:20px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
button{font:inherit;font-weight:600;font-size:1.05rem;padding:10px 20px;border-radius:999px;border:3px solid #fff;background:#4d96ff;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}

button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:linear-gradient(#ff8fb8,#ff4f8b);font-size:1.4rem;padding:12px 34px}
#add{background:#2ec4b6}#showPic{background:#ff9f1c}#sayEn{background:#9b5de5}#reset{background:#ffb703;color:#3b2f63}#back{background:#7a7fa8}
#list{width:100%;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:10px}

.hint{font-size:.95rem;color:var(--ink);font-weight:500;text-align:center;background:rgba(255,255,255,.75);padding:4px 14px;border-radius:14px}
.count{font-weight:700;font-size:1.3rem;color:#fff;background:#9b5de5;padding:4px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pic{width:min(100%,480px);height:320px;border:5px solid #ffd166;border-radius:28px;background:#fff;color:#ff9f1c;font-size:6rem;box-shadow:0 8px 0 #f2b84b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wrap{position:relative;display:inline-block;max-width:100%;margin-top:10px}
.boxes{display:flex;gap:10px;justify-content:center}
.box{--c:#ff6b6b;font-size:clamp(2.2rem,8.5vw,4.2rem);font-weight:700;padding:5px 16px;min-width:60px;text-align:center;background:#fff;border:6px solid var(--c);color:var(--c);border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.15);transition:background .12s,color .12s,transform .12s}

.mk{display:flex;gap:8px;width:100%;flex-wrap:wrap;justify-content:center}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<body>

<section class="screen on" id="s1">
  <h1>🌈 Sound Slider ⭐</h1>
  <p class="sub">Type a word and tap Make picture, or upload your own pictures.</p>
  <div class="card">
    <div class="auth" id="auth"></div>
    <div id="list"></div>
    <div class="mk"><input type="text" id="mkw" placeholder="Type a word, e.g. fish" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="mk">✨ Make picture</button></div>
    <button id="add">＋ Or upload pictures</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="hint">Sounds like <b>sh</b> are grouped automatically. To choose your own groups, type hyphens, like <b>s-t-ar</b>.</div>
    <div class="sub" id="msg"></div>
    <div class="hint" id="note"></div>
    <button class="main" id="go" disabled>Start ➜</button>
  </div>
</section>

<section class="screen" id="s2">
  <div class="count" id="count"></div>
  <div class="pic" id="pic">?</div>
  <div class="row">
    <button id="showPic">Show picture</button>
    <button id="sayEn">🔊 Say word</button>
    <button id="sayPl">🔊 Po polsku</button>
    <button id="reset">Reset</button>
    <button id="back">← Edit list</button>
  </div>
  <div class="wrap" id="wrap">
    <div class="boxes" id="boxes"></div>
    <div class="track" id="track"><div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  </div>
  <div class="pl" id="plShow"></div>
  <button class="main" id="next">Next picture ➜</button>
  <p class="hint">Drag the star from left to right. Each sound lights up as you reach it.</p>
</section>

<script>

var SUPABASE_KEY="sb_publishable_vsAylXS6qBKiXGO4DXKGkA_VQ6HkThl";   // the "anon" / "publishable" key
// =====================================================================
(function(){

  function sayL(t,l){if(!window.speechSynthesis||!t)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=0.8;speechSynthesis.speak(u)}

  }

  }

  }
  function renderList(){

      var t=document.createElement("input");t.type="text";t.value=p.word;t.placeholder="Type the word";
      t.autocapitalize="off";t.spellcheck=false;
      var g=document.createElement("div");g.className="gr";showGroups(p,g);
      t.oninput=function(){p.word=t.value.toLowerCase().replace(/[^a-z-]/g,"");showGroups(p,g);p.touched=false;autoPl(p,pi);cloudUpdate(p);check()};
      var pi=document.createElement("input");pi.type="text";pi.className="pli";pi.placeholder="Polish";pi.value=p.pl||"";pi.spellcheck=false;
      pi.oninput=function(){p.pl=pi.value.trim();p.touched=pi.value.trim()!=="";cloudUpdate(p)};
      var x=document.createElement("button");x.textContent="✕";x.setAttribute("aria-label","Remove");
      x.onclick=function(){cloudDelete(p);items.splice(i,1);renderList()};
      d.appendChild(im);d.appendChild(t);d.appendChild(g);d.appendChild(pi);if(sampler){var dr=document.createElement("button");dr.className="dr";dr.textContent="🎨";dr.title="Draw a new picture with AI";dr.disabled=!!p.busy;dr.onclick=function(){draw(p)};d.appendChild(dr)}d.appendChild(x);l.appendChild(d);autoPl(p,pi);
    });
    check();
  }
  $("add").onclick=function(){$("file").click()};

  // ---- make a picture from a typed word ----
  var emoji={cat:'🐱',dog:'🐶',fish:'🐟',sun:'☀️',hat:'🎩',bus:'🚌',car:'🚗',tree:'🌳',book:'📖',ship:'🚢',chair:'🪑',moon:'🌙',star:'⭐',frog:'🐸',duck:'🦆',bed:'🛏️',cup:'☕',pen:'🖊️',egg:'🥚',apple:'🍎',house:'🏠',milk:'🥛',bird:'🐦',boat:'⛵',rain:'🌧️',cow:'🐄',pig:'🐷',hen:'🐔',ball:'⚽',shoe:'👟',sheep:'🐑',fork:'🍴',bag:'👜',door:'🚪',flower:'🌸',water:'💧',bread:'🍞',cheese:'🧀',mouse:'🐭',fox:'🦊',lion:'🦁',bear:'🐻',horse:'🐴',chicken:'🐔',thumb:'👍',brush:'🖌️',king:'🤴',ring:'💍',rabbit:'🐰',snake:'🐍',bee:'🐝',ant:'🐜',bat:'🦇',bell:'🔔',bike:'🚲',box:'📦',cake:'🍰',clock:'🕐',cloud:'☁️',coat:'🧥',crab:'🦀',drum:'🥁',ear:'👂',eye:'👁️',hand:'✋',leg:'🦵',nose:'👃',mouth:'👄',foot:'🦶',finger:'☝️',girl:'👧',boy:'👦',man:'👨',baby:'👶',mom:'👩',dad:'👨',sock:'🧦',pan:'🍳',pot:'🍲',jam:'🍓',kite:'🪁',leaf:'🍃',lamp:'💡',map:'🗺️',nut:'🥜',owl:'🦉',pear:'🍐',pizza:'🍕',plane:'✈️',rice:'🍚',road:'🛣️',sand:'🏖️',sea:'🌊',snow:'❄️',soap:'🧼',spoon:'🥄',train:'🚆',truck:'🚚',wolf:'🐺',worm:'🐛',zebra:'🦓',banana:'🍌',orange:'🍊',carrot:'🥕',tomato:'🍅',potato:'🥔',shirt:'👕',dress:'👗',teacher:'🧑‍🏫',school:'🏫',elephant:'🐘',monkey:'🐵',tiger:'🐯',turtle:'🐢',whale:'🐳',butterfly:'🦋',spider:'🕷️',strawberry:'🍓',grape:'🍇',lemon:'🍋',burger:'🍔',hamburger:'🍔',icecream:'🍦',giraffe:'🦒',penguin:'🐧',dolphin:'🐬',rocket:'🚀',heart:'❤️',fire:'🔥',tooth:'🦷',key:'🔑',gift:'🎁',phone:'📱',camera:'📷',guitar:'🎸',piano:'🎹'};
  function note(t){$("note").textContent=t}

  // ---- Supabase (saves your list and pictures to your account) ----
  var sb=null,user=null,saveTimers={};

  function itemFromRow(r){

    files.reduce(function(chain,f){

    },Promise.resolve()).then(function(){note("");renderList()}).catch(function(e){note("Upload failed: "+(e.message||e));renderList()});
  }
  function emojiSrc(e){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="28" fill="#fff7d6"/><text x="100" y="108" font-size="130" fill="#bbb" text-anchor="middle" dominant-baseline="central">'+e+'</text></svg>')}
  function addWord(){
    var w=$("mkw").value.toLowerCase().replace(/[^a-z-]/g,"");
    if(!w||items.length>=MAX||needSignIn())return;
    var key=w.replace(/-/g,""),p={word:w,pl:dict[key]||"",emojiChar:emoji[key]||null,src:emoji[key]?emojiSrc(emoji[key]):emojiSrc("?")};
    items.push(p);cloudInsert(p);$("mkw").value="";note("");
    if(!emoji[key]){
      if(sampler)draw(p);
      else note("No built-in picture for "+key+". Tap the picture to upload your own, or use the Claude page so AI can draw it.");
    }
    renderList();
  }
  function draw(p){
    if(!sampler)return;
    var w=p.word.replace(/-/g,"");
    p.busy=true;note("Drawing "+w+"…");renderList();
    sampler('Draw a simple, cute, colorful cartoon picture of: '+w+'. It is for young children learning English. Output ONE SVG only: viewBox="0 0 200 200", a soft light background rectangle, bold simple shapes, no text or letters, no external links, no scripts. Reply with only the SVG code.').then(function(r){
      var m=(r.text||'').match(/<svg[\s\S]*<\/svg>/i),s=m&&m[0];
      if(s&&!/<script|\son\w+\s*=|href\s*=|<image|<foreignObject/i.test(s)){
        if(!/xmlns=/i.test(s))s=s.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
        p.src='data:image/svg+xml,'+encodeURIComponent(s);note("");
      }else note("Could not draw that one. Press the paint button to try again, or upload a photo.");
    }).catch(function(){note("Could not draw that one. Try again, or upload a photo.")}).then(function(){p.busy=false;renderList()});
  }
  function swap(p){
    var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
    inp.onchange=function(){var f=inp.files[0];if(!f)return;if(sb){if(needSignIn())return;compress(f).then(uploadBlob).then(function(path){if(p.path)sb.storage.from("pics").remove([p.path]);p.path=path;p.emojiChar=null;p.src=pubUrl(path);cloudUpdate(p);renderList()}).catch(function(e){note("Upload failed: "+(e.message||e))});return}var r=new FileReader();r.onload=function(){p.src=r.result;renderList()};r.readAsDataURL(f)};
    inp.click();
  }
  $("mk").onclick=addWord;
  $("mkw").onkeydown=function(e){if(e.key==="Enter")addWord()};
  $("file").onchange=function(e){
    var files=Array.prototype.slice.call(e.target.files).slice(0,MAX-items.length);
    if(sb){e.target.value="";cloudUploadMany(files);return}
    var res=new Array(files.length),left=files.length;
    files.forEach(function(f,n){
      var r=new FileReader();
      r.onload=function(){
        res[n]={src:r.result,word:f.name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z]/g,"")};
        if(--left===0){items=items.concat(res);renderList()}
      };
      r.readAsDataURL(f);
    });
    e.target.value="";
  };

  // Screen 2
  function show(i){
    idx=i;var p=items[i];
    $("count").textContent="Picture "+(i+1)+" of "+items.length;
    $("plShow").textContent=p.pl||"";
    picShown=false;$("pic").textContent="?";$("showPic").textContent="Show picture";
    var b=$("boxes");b.innerHTML="";boxEls=[];
    groupsOf(p.word).forEach(function(t){var d=document.createElement("div");d.className="box";d.textContent=t;b.appendChild(d);boxEls.push(d)});
    $("next").textContent=i===items.length-1?"↺ Back to first picture":"Next picture ➜";
    wasAll=false;setX0(0);
  }
  $("go").onclick=function(){$("s1").classList.remove("on");$("s2").classList.add("on");show(0)};
  $("back").onclick=function(){$("s2").classList.remove("on");$("s1").classList.add("on")};
  $("next").onclick=function(){show((idx+1)%items.length)};
  $("showPic").onclick=function(){
    picShown=!picShown;
    var p=$("pic");p.innerHTML="";
    if(picShown){var im=new Image();im.src=items[idx].src;p.appendChild(im)}else p.textContent="?";
    this.textContent=picShown?"Hide picture":"Show picture";
  };
  $("sayEn").onclick=function(){say(items[idx].word.replace(/-/g,""))};
  $("sayPl").onclick=function(){sayL(items[idx].pl,"pl-PL")};
  $("reset").onclick=function(){setX(0)};

  function setX(x){
    setX0(x);
    var all=boxEls.length>0&&boxEls.every(function(b){return b.classList.contains("lit")});
    if(all&&!wasAll)say(items[idx].word.replace(/-/g,""));
    wasAll=all;
  }
  function setX0(x){
    var w=$("track").clientWidth;
    x=Math.max(0,Math.min(w,x));
    $("fill").style.width=x+"px";$("knob").style.left=x+"px";
    boxEls.forEach(function(b){
      b.classList.toggle("lit",x>0&&x>=b.offsetLeft+b.offsetWidth*0.4);
    });
  }
  var tr=$("track");
  function move(e){setX(e.clientX-tr.getBoundingClientRect().left)}
  tr.addEventListener("pointerdown",function(e){dragging=true;tr.setPointerCapture(e.pointerId);move(e);e.preventDefault()});
  tr.addEventListener("pointermove",function(e){if(dragging)move(e)});
  tr.addEventListener("pointerup",function(){dragging=false});
  tr.addEventListener("pointercancel",function(){dragging=false});
  window.addEventListener("resize",function(){if($("s2").classList.contains("on"))setX0(0)});
  renderList();
  initCloud();
  if(window.claude&&claude.use){claude.use("sample").then(function(s){sampler=s;renderList()}).catch(function(){})}
})();
</script>
</body>
</html>
